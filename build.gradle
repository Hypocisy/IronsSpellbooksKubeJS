    implementation ("dev.architectury:architectury-neoforge:${architectury_version}")
    implementation ("io.redspace:irons_spellbooks:${irons_spells_version}")
    implementation ("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    compileOnly ("curse.maven:entityjs-967617:${entityjs_file_id}")
    compileOnly ("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    compileOnly ("curse.maven:probejs-585406:5820894")
    implementation ("curse.maven:probejs-585406:5820894")

    // Real dependencies for Runtime
    runtimeOnly ("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    runtimeOnly ("top.theillusivec4.caelus:caelus-neoforge:${caelus_version}")
    runtimeOnly ("dev.kosmx.player-anim:player-animation-lib-neoforge:${player_animator_version}")
    runtimeOnly ("curse.maven:entityjs-967617:${entityjs_file_id}")
    //runtimeOnly fg.deobf("curse.maven:probejs-585406:5227399")

    // Qol
    runtimeOnly ("mezz.jei:jei-${jei_mc_version}-neoforge:${jei_version}")
    // runtimeOnly fg.deobf("curse.maven:probejs-585406:5227399")

//    implementation files("libs/irons_spellbooks-1.20.1-3.2.1.jar")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
//    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
//        jarJar.ranged(it, "[0.4.1,)")
//    }

    implementation 'org.reflections:reflections:0.10.2'
}

